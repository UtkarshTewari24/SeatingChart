name: Daily aurafarm commits

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-aurafarm-commits-${{ github.repository }}
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create and push daily commits
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GENERATED_FILE: .github/daily-generated.txt
        run: |
          set -euo pipefail

          if [[ -z "${DEFAULT_BRANCH}" ]]; then
            echo "The repository default branch could not be determined." >&2
            exit 1
          fi

          if [[ "$(git branch --show-current)" != "${DEFAULT_BRANCH}" ]]; then
            echo "Refusing to run outside the default branch." >&2
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Refusing to run with a dirty checkout." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA="$(git rev-parse HEAD)"
          COUNT=$((RANDOM % 21 + 80))
          echo "Creating ${COUNT} commits on ${DEFAULT_BRANCH}."

          mkdir -p "$(dirname "${GENERATED_FILE}")"

          for ((i = 1; i <= COUNT; i++)); do
            RANDOM_VALUE="$(printf '%08x' "$(((RANDOM << 16) ^ RANDOM))")"
            printf 'aurafarm %s %s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%S.%NZ')" \
              "${RANDOM_VALUE}" >> "${GENERATED_FILE}"

            git add -- "${GENERATED_FILE}"

            STAGED_FILES="$(git diff --cached --name-only)"
            if [[ "${STAGED_FILES}" != "${GENERATED_FILE}" ]]; then
              echo "Refusing to commit unexpected staged paths:" >&2
              printf '%s\n' "${STAGED_FILES}" >&2
              exit 1
            fi

            git commit -m "Daily update #${i}" -- "${GENERATED_FILE}"
          done

          CHANGED_FILES="$(git diff --name-only "${BASE_SHA}..HEAD")"
          if [[ "${CHANGED_FILES}" != "${GENERATED_FILE}" ]]; then
            echo "Refusing to push because an unexpected path changed:" >&2
            printf '%s\n' "${CHANGED_FILES}" >&2
            exit 1
          fi

          CREATED_COUNT="$(git rev-list --count "${BASE_SHA}..HEAD")"
          if [[ "${CREATED_COUNT}" -ne "${COUNT}" ]]; then
            echo "Expected ${COUNT} commits but created ${CREATED_COUNT}." >&2
            exit 1
          fi

          git push origin "HEAD:${DEFAULT_BRANCH}"
